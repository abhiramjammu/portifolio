<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jaya Abhiram - Full Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Scalable Grid specifically for 9:16 videos */
    .scalable-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
      padding: 40px;
      max-width: 1400px;
      margin: 0 auto 80px auto;
    }
    
    .portfolio-header {
      text-align: center;
      padding: 120px 20px 40px 20px;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND EFFECTS -->
  <div class="bg-effects">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- NAVBAR -->
  <nav>
    <div class="nav-brand">&lt;JS<span class="text-gradient">A</span>/&gt;</div>
    <a href="index.html" class="btn-primary" style="padding: 10px 24px; font-size: 0.9rem;">&larr; Back Home</a>
  </nav>

  <!-- HEADER -->
  <div class="portfolio-header reveal-up">
    <div class="dark-pill" style="margin: 0 auto 1.5rem auto;">
      <div class="glow-dot dot-red"></div>
      Short-form & Education
    </div>
    <h1 style="font-size: 3.5rem; margin-bottom: 1rem;">Complete <span class="text-gradient">Portfolio</span></h1>
    <p style="color: #a0a0a0; max-width: 600px; margin: 0 auto; font-size: 1.1rem;">
      A collection of high-impact 9:16 content designed to maximize retention, educate audiences, and drive engagement.
    </p>
  </div>

  <!-- SCALABLE 9:16 GRID -->
  <div class="scalable-grid reveal-up">
    <!-- Reels & Shorts -->
    <div class="video-container portrait hover-glow"><video data-src="assets/video9.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    <div class="video-container portrait hover-glow"><video data-src="assets/video11.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    <div class="video-container portrait hover-glow"><video data-src="assets/video12.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    <div class="video-container portrait hover-glow"><video data-src="assets/video13.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    
    <!-- Education & Information -->
    <div class="video-container portrait hover-glow"><video data-src="assets/scroll1.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    <div class="video-container portrait hover-glow"><video data-src="assets/scroll2.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    <div class="video-container portrait hover-glow"><video data-src="assets/scroll3.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    <div class="video-container portrait hover-glow"><video data-src="assets/scroll4.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    <div class="video-container portrait hover-glow"><video data-src="assets/scroll5.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    <div class="video-container portrait hover-glow"><video data-src="assets/scroll6.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    <div class="video-container portrait hover-glow"><video data-src="assets/scroll7.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    <div class="video-container portrait hover-glow"><video data-src="assets/scroll8.mp4" muted playsinline loop></video><button class="volume-btn">🔇</button></div>
    
    <!-- You can easily add more videos below; the grid will handle it automatically! -->
  </div>

  <script src="js/main.js"></script>
</body>
</html>
